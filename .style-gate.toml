# Configuration for tool/style_gate.py -- see code-style.md.
#
# Nothing here changes the rules. It says which files in *this* tree they
# apply to.

# A Makefile has neither a suffix nor a shebang, so without this line it is
# not checked at all. Naming it applies the tab rule too, which is right
# while the Makefile has no `ifeq` (whose body must be space-indented).
indent_names = ["Makefile"]

# ASCII outside string literals, Markdown exempt -- the global rule.
# project.md uses typographic punctuation and box drawing, which
# documentation may; hull_engine.h was transliterated to ASCII when this
# was turned on.
ascii_only = true
ascii_exclude_markdown = true

# A fraction of every path git lists: the gated count must be at least
# this share, so an edit that collapses the selection fires while adding
# files never does. Half the ratio last measured: 16 of 19, 2026-10-09,
# when the reader arrived with a submodule git lists as one path.
floor = 0.42

# situ's schemas and its committed contract files are text this tree
# writes, so they get the whitespace, final-newline and ASCII checks.
# `.map` is in the defaults already; naming the list replaces it.
text_suffixes = [".md", ".json", ".toml", ".cfg", ".map", ".situ", ".wire", ".vectors"]
