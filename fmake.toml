[project]
defines = ['HULL_VERSION="$file(VERSION)"']
include-dirs = ["gen"]

# The guest agent, named and linked as the Makefile does it: its own
# name, agent, is a directory beside it, and it is a vm's init in an
# initrd with no libc to load.
[target.agent]
name = "hull-agent"
root = "agent/agent.c"
ldflags = ["-static"]

# The NSS module, a library with no main(), so named rather than found:
# libnss_hull.so with the soname glibc loads, libnss_hull.so.2, which
# `make install-nss` installs it as. Its hidden visibility is the file's
# own @cflags, since a shared target takes no cflags here.
# A module, named by exactly what loads it: glibc builds libnss_hull.so.2
# from the hosts line and dlopens that, so the version gives the soname,
# and no .pc is written, which a shared target would (fmake b0eaafe).
[target.nss]
name = "libnss_hull"
kind = "module"
version = "2"
sources = ["nss/nss_hull.c"]

# One rule per schema, with the options the Makefile gives situc: fmake's
# own schema pass gives every schema the same ones, and these differ in
# prefix and layer. Where a schema has one, it stands down for the rule.

[generate.readable]
command = "mkdir -p gen && vendor/situ/bin/situc build --target c --prefix hull_sexpr_r --out gen sexpr/readable.situ"
inputs = ["sexpr/readable.situ"]
outputs = ["gen/readable.c", "gen/readable.h"]

# The edit layer, whose build header the writer appends with.
[generate.canonical]
command = "mkdir -p gen && vendor/situ/bin/situc build --target c --layer edit --prefix hull_sexpr_c --out gen sexpr/canonical.situ"
inputs = ["sexpr/canonical.situ"]
outputs = ["gen/canonical.c", "gen/canonical.h", "gen/canonical_build.h", "gen/canonical_edit.h"]

[generate.agent]
command = "mkdir -p gen && vendor/situ/bin/situc build --target c --layer frame --prefix hull_agent --out gen agent/message.situ"
inputs = ["agent/message.situ"]
outputs = ["gen/message.c", "gen/message.h", "gen/message_frame.h", "gen/message_build.h", "gen/message_edit.h"]

[generate.frontend]
command = "mkdir -p gen && vendor/situ/bin/situc build --target c --prefix hull_frontend --out gen core/frontend.situ"
inputs = ["core/frontend.situ", "sexpr/canonical.situ"]
outputs = ["gen/frontend.c", "gen/frontend.h"]

[generate.protocol]
command = "mkdir -p gen && vendor/situ/bin/situc build --target c --prefix hull_protocol --out gen agent/protocol.situ"
inputs = ["agent/protocol.situ", "sexpr/canonical.situ"]
outputs = ["gen/protocol.c", "gen/protocol.h"]
